  const sizeLabel = approxBytes > 1024*1024 ? (approxBytes/1024/1024).toFixed(2)+' MB' : (approxBytes/1024).toFixed(1)+' KB';

  app.innerHTML = `
    <div class="panel">
      <div class="panel-title">All Production Entries</div>
      <div class="section-header">
        <div class="date-presets" id="pDatePresets">
          <button data-p="today">Today</button><button data-p="week">This Week</button><button data-p="month">This Month</button><button data-p="custom" class="on">Custom</button>
        </div>
        <div class="mini-kpi-row" id="prodMiniKpis"></div>
        <b style="font-size:12px;display:block;margin:10px 0 4px;">Efficiency by Machine <span style="font-weight:400;color:var(--steel-600);">— Cumulative Std Hours method</span></b>
        <div style="overflow-x:auto;"><table class="eff" id="effTable"></table></div>
      </div>
      <div class="stat-line">${(entries||[]).length} entries · approx. ${sizeLabel} · <button class="btn ghost small" id="exportBtn">Export to Excel</button> · <button class="btn ghost small" id="exportSummaryBtn">Export Summary Report</button></div>
      <div class="row3" style="margin-bottom:4px;">
        <div><label>Filter Machine</label><select id="filterM"><option value="">All</option>${(jobs||[]).map(j=>`<option value="${esc(j.machine_no)}">${esc(j.machine_no)}</option>`).join('')}</select></div>
        <div><label>Filter Status</label><select id="filterS"><option value="">All</option><option>Completed</option><option>Partial</option><option>Hold</option></select></div>
        <div><label>Search Operator</label><input id="filterOp" placeholder="Type a name…"></div>
      </div>
      <div class="row2" style="margin-bottom:10px;">
        <div><label>From Date</label><input id="filterFrom" type="date"></div>
        <div><label>To Date</label><input id="filterTo" type="date"></div>
      </div>
      <div class="table-scroll"><table class="entries" id="entryTable"></table></div>
    </div>

    <div class="panel">
      <div class="panel-title">Bulk Add Missed Entries</div>
      <div class="stat-line">Paste rows copied from Excel — columns in order: Machine No, Op No, Operator Name, Date (YYYY-MM-DD), Start Time, End Time, Status, Issue Reason, Delay Hours, Responsibility. Header row optional. Start/End/Issue/Delay/Responsibility can be left blank unless Status is Hold.</div>
      <textarea id="bulkPaste" placeholder="7822M&#9;10&#9;Vaseem&#9;2026-08-05&#9;09:00&#9;17:00&#9;Completed" style="min-height:100px;font-family:var(--font-mono);font-size:12px;"></textarea>
      <button class="btn amber" id="bulkAddBtn" style="margin-top:8px;">Add Rows</button>
      <div id="bulkResults" style="margin-top:10px;"></div>
    </div>

    <div class="panel">
      <div class="panel-title">Archive Old Entries</div>
      <div class="stat-line">Exports everything before the date to Excel, then deletes it from the live table to keep things fast. Cannot be undone.</div>
      <div class="row2">
        <div><label>Delete entries logged before</label><input id="archiveDate" type="date"></div>
        <div style="display:flex;align-items:flex-end;"><button class="btn red" id="archiveBtn" style="width:100%;">Export & Delete Before Date</button></div>
      </div>
    </div>
  `;

  function paint(){
    const fm = document.getElementById('filterM').value;
    const fs = document.getElementById('filterS').value;
    const fo = document.getElementById('filterOp').value.trim().toLowerCase();
    const ffrom = document.getElementById('filterFrom').value;
    const fto = document.getElementById('filterTo').value;
    const rows = (entries||[]).filter(e =>
      (!fm || e.jobs?.machine_no===fm) &&
      (!fs || e.status===fs) &&
      (!fo || (e.primary_operator||'').toLowerCase().includes(fo)) &&
      (!ffrom || e.activity_date >= ffrom) &&
      (!fto || e.activity_date <= fto)
    );
    lastFilteredEntries = rows;

    const completedCt = rows.filter(e=>e.status==='Completed').length;
    const partialCt = rows.filter(e=>e.status==='Partial').length;
    const holdCt = rows.filter(e=>e.status==='Hold').length;
    document.getElementById('prodMiniKpis').innerHTML = `
      <div class="mini-kpi"><div class="num">${rows.length}</div><div class="lbl">Total Entries</div></div>
      <div class="mini-kpi"><div class="num">${completedCt}</div><div class="lbl">Completed</div></div>
      <div class="mini-kpi"><div class="num">${partialCt}</div><div class="lbl">Partial</div></div>
      <div class="mini-kpi"><div class="num">${holdCt}</div><div class="lbl">Hold</div></div>
    `;

    const effRows = computeEfficiency(rows, jobOpsAll||[], entryOpsByEntry, jobsById);
    lastEffRows = effRows;
    document.getElementById('effTable').innerHTML = `<tr><th>Machine</th><th>Customer</th><th>Total Std Hrs</th><th>Machine Hrs</th><th>Man-Hrs</th><th>Cumulative Std Hrs</th><th>Eff %</th></tr>` +
      (effRows.length ? effRows.map(r=>`<tr>
        <td><b>${esc(r.machine_no)}</b></td><td>${esc(r.customer||'')}</td>
        <td class="mono">${r.stdHours.toFixed(1)}</td><td class="mono">${r.actualHours.toFixed(1)}</td>
        <td class="mono">${r.actualLabourHours.toFixed(1)}</td><td class="mono">${r.earnedHours.toFixed(1)}</td>
        <td class="mono" style="font-weight:700;color:${r.effPct===null?'var(--steel-600)':r.effPct>=100?'var(--green-600)':'var(--red-600)'};">${r.effPct===null?'—':r.effPct.toFixed(0)+'%'}</td>
      </tr>`).join('') : `<tr><td class="empty" colspan="7">No data for current filters.</td></tr>`);

    const table = document.getElementById('entryTable');
    table.innerHTML = rowsHtml(rows, entryOpsByEntry);
    wireEditButtons(table, entries, app);
  }
  paint();
  document.getElementById('filterM').onchange = paint;
  document.getElementById('filterS').onchange = paint;
  document.getElementById('filterOp').oninput = paint;
  document.getElementById('filterFrom').onchange = ()=>{ setPresetOn('pDatePresets','custom'); paint(); };
  document.getElementById('filterTo').onchange = ()=>{ setPresetOn('pDatePresets','custom'); paint(); };
  document.querySelectorAll('#pDatePresets button').forEach(b=>{
    b.onclick = ()=>{
      setPresetOn('pDatePresets', b.dataset.p);
      applyDatePreset(b.dataset.p, document.getElementById('filterFrom'), document.getElementById('filterTo'));
      paint();
    };
  });

  document.getElementById('bulkAddBtn').onclick = (e)=> withLock(e.target, 'Adding…', async ()=>{
    const text = document.getElementById('bulkPaste').value;
    const rows = parseBulkEntries(text);
    const resultsEl = document.getElementById('bulkResults');
    if(rows.length===0){ toast('No valid rows found in pasted text', true); return; }
    const anyAdded = await bulkAddEntries(rows, resultsEl);
    if(anyAdded){ document.getElementById('bulkPaste').value=''; renderProductionEntries(app); }
  });

  document.getElementById('exportBtn').onclick = ()=> exportRows(entries||[], 'production_log_'+new Date().toISOString().slice(0,10)+'.xlsx');

  document.getElementById('exportSummaryBtn').onclick = async ()=>{
    const { data: issueEntriesFull } = await sb.from('entries').select('*, jobs(machine_no)').not('issue_reason','is',null);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
      { Metric:'Total Entries (current filter)', Value:lastFilteredEntries.length },
      { Metric:'Note', Value:'Efficiency sheet reflects whichever filters are currently applied on this page. Delay sheets reflect the Delay/Issue Log tab all-time data.' }
    ]), 'Overview');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lastEffRows.map(r=>({
      Machine:r.machine_no, Customer:r.customer, Model:r.model_name,
      TotalStdHours:r.stdHours.toFixed(1), MachineHours:r.actualHours.toFixed(1), ManHours:r.actualLabourHours.toFixed(1),
      CumulativeStdHours:r.earnedHours.toFixed(1), EfficiencyPct: r.effPct===null?'':r.effPct.toFixed(1)
    }))), 'Efficiency by Machine');
    const respMap={}; (issueEntriesFull||[]).forEach(e=>{ if(e.responsibility) respMap[e.responsibility]=(respMap[e.responsibility]||0)+(parseFloat(e.delay_hours)||0); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(respMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({Responsibility:k, DelayHours:v.toFixed(1)}))), 'Delay by Responsibility');
    const machMap={}; (issueEntriesFull||[]).forEach(e=>{ const m=e.jobs?.machine_no; if(m) machMap[m]=(machMap[m]||0)+(parseFloat(e.delay_hours)||0); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(machMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({Machine:k, DelayHours:v.toFixed(1)}))), 'Delay by Machine');
    XLSX.writeFile(wb, 'summary_report_'+new Date().toISOString().slice(0,10)+'.xlsx');
  };

  document.getElementById('archiveBtn').onclick = (e)=> withLock(e.target, 'Archiving…', async ()=>{
    const cutoff = document.getElementById('archiveDate').value;
    if(!cutoff) { toast('Pick a cutoff date', true); return; }
    const toArchive = (entries||[]).filter(en => en.activity_date < cutoff);
    if(toArchive.length===0) { toast('No entries before that date', true); return; }
    if(!confirm(`This will export ${toArchive.length} entries and permanently delete them from the live dashboard. Continue?`)) return;
    exportRows(toArchive, 'archive_before_'+cutoff+'.xlsx');
    const ids = toArchive.map(en=>en.id);
    const { error: delErr } = await sb.from('entries').delete().in('id', ids);
    if(delErr) { toast('Delete failed: '+delErr.message, true); return; }
    toast('Archived and deleted '+ids.length+' entries');
    renderProductionEntries(app);
  });
}

/* ================= STATION DISPLAY (rotating floor TV — public, no login) ================= */
let tvRotateTimer=null, tvRefreshTimer=null, tvStations=[], tvIndex=0, tvResponsibilities=null, tvPaused=false;

async function fetchStations(){
  const { data, error } = await sb.rpc('get_station_summary');
  if(error){ console.error(error); return []; }
  return data || [];
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
}
function fmtClock(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}
function fmtDateTime(ts){
  if(!ts) return '—';
  const dt = new Date(ts);
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) + ' | ' + fmtClock(ts);
}
function hoursSince(ts){
  if(!ts) return 0;
  return Math.max(0, (Date.now() - new Date(ts).getTime()) / 3600000);
}
function statusKey(s){ return s==='In Progress' ? 'InProgress' : s; } // css-safe class

async function renderStationCard(app, s, idx, total){
  if(!s){
    app.innerHTML = `<div class="tv-empty">No active stations right now.</div>`;
    return;
  }
  const isLate = s.delivery_date && s.estimated_delivery_date && s.estimated_delivery_date > s.delivery_date;

  const [{data:ops}, {data:activity}, {data:deptDelays}, {data:topReasons}] = await Promise.all([
    sb.rpc('get_job_operations_progress', {p_job_id: s.job_id}),
    sb.rpc('get_job_recent_activity', {p_job_id: s.job_id, p_limit: 6}),
    sb.rpc('get_job_dept_delays', {p_job_id: s.job_id}),
    sb.rpc('get_job_top_delay_reasons', {p_job_id: s.job_id})
  ]);
  const opList = ops || [];
  const activityList = activity || [];

  const currentOp = opList.find(o=>o.is_current) || opList.find(o=>o.status==='Hold') || null;
  const isOnHold = !!(currentOp && currentOp.status === 'Hold');
  const holdHrs = isOnHold && currentOp.last_status_at ? hoursSince(currentOp.last_status_at) : 0;

  const completedCt = opList.filter(o=>o.status==='Completed').length;
  const inProgCt = opList.filter(o=>o.status==='In Progress').length;
  const holdCt = opList.filter(o=>o.status==='Hold').length;
  const pendingCt = opList.filter(o=>o.status==='Pending').length;
  const stdTotal = opList.reduce((sum,o)=>sum+(Number(o.std_hours)||0),0);
  const stdDone = opList.filter(o=>o.status==='Completed').reduce((sum,o)=>sum+(Number(o.std_hours)||0),0);
  const overallPct = stdTotal>0 ? Math.round((stdDone/stdTotal)*100) : 0;
  // Remaining = std hours minus what's already been earned minus hours already lost to delay
  const remainingHours = Math.max(0, (s.std_hours||0) - (s.earned_hours||0) - (s.delay_hours_total||0));
  const effPct = (s.actual_hours||0) > 0 ? ((s.earned_hours||0) / s.actual_hours * 100) : null;

  const deliveryAtRisk = isOnHold || isLate;
  const lastActivityTs = activityList.length ? activityList[0].created_at : null;

  app.innerHTML = `
    <div class="tv-card">

      <div class="tv-header">
        <div class="tv-head-left">
          <div class="tv-station-no">STATION ${s.station_no ?? '—'}<span class="tv-progress">${idx+1} / ${total}</span></div>
          <div class="tv-machine">${esc(s.machine_no)}</div>
          <div class="tv-sub">${esc(s.customer||'')} · ${esc(s.model_name||'')}</div>
        </div>

        <div class="tv-head-center">
          <div class="tv-op-label">Current Operation</div>
          <div class="tv-op-name status-${statusKey(currentOp?.status||'')}">
            ${currentOp ? `<span class="opno">${esc(currentOp.op_no)}</span> — ${esc(currentOp.description)}` : (s.current_stage ? esc(s.current_stage) : 'No open operation')}
          </div>
          <div class="tv-op-tags">
            ${isOnHold ? `<span class="tv-status-pill Hold"><span class="dot"></span>HOLD</span><span class="tv-hold-duration">for ${holdHrs.toFixed(1)} h</span>`
              : currentOp ? `<span class="tv-status-pill Running"><span class="dot"></span>${esc(currentOp.status)}</span>` : ''}
          </div>
        </div>

        <div class="tv-head-right">
          <div class="tv-updated">LAST UPDATED<b>${lastActivityTs ? fmtDateTime(lastActivityTs) : 'No entries yet'}</b></div>
          ${currentOp ? `<button class="tv-pause-btn ${isOnHold?'resume':'hold-active'}" id="tvHoldBtn">
              <span class="dot"></span>${isOnHold ? 'RESUME' : 'HOLD'}
            </button>` : ''}
        </div>
      </div>

      <div class="tv-metrics">
        <div class="tv-metric"><div class="tv-metric-lbl">Total Std Hours</div><div class="tv-metric-num">${(s.std_hours||0).toFixed(1)}h</div></div>
        <div class="tv-metric"><div class="tv-metric-lbl">Actual Hours</div><div class="tv-metric-num">${(s.actual_hours||0).toFixed(1)}h</div></div>
        <div class="tv-metric"><div class="tv-metric-lbl">Cumulative Std Hours</div><div class="tv-metric-num">${(s.earned_hours||0).toFixed(1)}h</div></div>
        <div class="tv-metric ${effPct!==null && effPct<100?'warn':''}"><div class="tv-metric-lbl">Efficiency %</div><div class="tv-metric-num">${effPct===null?'—':effPct.toFixed(0)+'%'}</div></div>
        <div class="tv-metric ${s.delay_hours_total>0?'warn':''}"><div class="tv-metric-lbl">Delay Hours</div><div class="tv-metric-num">${(s.delay_hours_total||0).toFixed(1)}h</div></div>
        <div class="tv-metric highlight"><div class="tv-metric-lbl">Remaining Hours</div><div class="tv-metric-num">${remainingHours.toFixed(1)}h</div></div>
      </div>

      <div class="tv-progress-panel">
        <div class="tv-progress-title">Operation Progress (${opList.length} Operations)</div>
        ${opList.length ? `
        <div class="tv-timeline">
          ${opList.map((o,i)=>`
            ${i>0 ? `<div class="tv-connector ${opList[i-1].status==='Completed'?'done':''}"></div>` : ''}
            <div class="tv-node-wrap">
              <div class="tv-node ${statusKey(o.status)}" title="${esc(o.description)}">${o.status==='Completed'?'✓':esc(o.op_no)}</div>
            </div>
          `).join('')}
        </div>
        <div class="tv-legend">
          <span><span class="sw Completed"></span>Completed: <span class="count">${completedCt}</span></span>
          <span><span class="sw InProgress"></span>In Progress: <span class="count">${inProgCt}</span></span>
          <span><span class="sw Hold"></span>Hold: <span class="count">${holdCt}</span></span>
          <span><span class="sw Pending"></span>Pending: <span class="count">${pendingCt}</span></span>
          <span class="pct">${overallPct}%<span class="bar"><i style="width:${overallPct}%"></i></span></span>
        </div>
        ` : `<div class="tv-activity-empty">No operations set up for this job yet.</div>`}
      </div>

      <div class="tv-cols">
        <div class="tv-col">
          <div class="tv-col-title">Current Operation Details</div>
          ${currentOp ? `
            <div class="tv-detail-op">${esc(currentOp.op_no)} — ${esc(currentOp.description)}</div>
            <div class="tv-detail-row"><div class="k">Status</div><div class="v">${esc(currentOp.status)}${isOnHold?` for ${holdHrs.toFixed(1)} h`:''}</div></div>
            ${currentOp.last_responsibility ? `<div class="tv-detail-row"><div class="k">Department</div><div class="v">${esc(currentOp.last_responsibility)}</div></div>` : ''}
            ${currentOp.last_issue_reason ? `<div class="tv-detail-row"><div class="k">Reason</div><div class="v">${esc(currentOp.last_issue_reason)}</div></div>` : ''}
            ${currentOp.last_operator ? `<div class="tv-detail-row"><div class="k">Last Logged By</div><div class="v">${esc(currentOp.last_operator)}</div></div>` : ''}
          ` : `<div class="tv-activity-empty">All operations completed.</div>`}
        </div>

        <div class="tv-col">
          <div class="tv-col-title ${deliveryAtRisk?'warn':''}">Delivery Status</div>
          <div class="tv-plan-chip">SO DELIVERY<b>${fmtDate(s.delivery_date)}</b></div>
          <div class="tv-plan-chip ${isLate?'late':''}">EST. DELIVERY<b>${s.estimated_delivery_date ? fmtDate(s.estimated_delivery_date) : 'TBD'}</b></div>
          <div class="tv-health ${deliveryAtRisk?'risk':'ok'}">${deliveryAtRisk?'⚠ AT RISK':'✓ ON TRACK'}</div>
          <div class="tv-health-note">${isOnHold ? 'Delay risk due to current hold.' : (isLate ? 'Estimated delivery is later than SO delivery.' : 'No active risk factors.')}</div>
        </div>
      </div>

      <div class="tv-cols" style="margin-top:14px;grid-template-columns:1fr 1fr;">
        <div class="tv-col">
          <div class="tv-col-title">Delay by Department</div>
          ${(deptDelays && deptDelays.length) ? deptDelays.map(d=>`<div class="tv-rank-row"><span>${esc(d.responsibility)}</span><span>${Number(d.total_hours).toFixed(1)}h</span></div>`).join('') : `<div class="tv-activity-empty">No delays logged</div>`}
        </div>
        <div class="tv-col">
          <div class="tv-col-title">Top Delay Reasons</div>
          ${(topReasons && topReasons.length) ? topReasons.map(r=>`<div class="tv-rank-row"><span>${esc(r.reason)}</span><span>${Number(r.total_hours).toFixed(1)}h</span></div>`).join('') : `<div class="tv-activity-empty">No delays logged</div>`}
        </div>
      </div>

      <div style="text-align:center;font-size:10.5px;color:var(--steel-300);margin-top:16px;">
        Progress and hours are updated based on the latest confirmations.
      </div>
    </div>
  `;

  const holdBtn = document.getElementById('tvHoldBtn');
  if(holdBtn) holdBtn.onclick = ()=> openTvHoldModal(app, s, idx, total, currentOp, isOnHold, holdHrs);
}

async function openTvHoldModal(app, s, idx, total, currentOp, isOnHold, holdHrs){
  if(!tvResponsibilities){
    const { data } = await sb.from('responsibilities').select('*').order('name');
    tvResponsibilities = data || [];
  }
  const overlay = document.createElement('div');
  overlay.className = 'tv-modal-overlay';
  overlay.innerHTML = `
    <div class="tv-modal">
      <h3>${isOnHold ? `Resume ${esc(currentOp.op_no)} — ${esc(currentOp.description)}` : `Hold ${esc(currentOp.op_no)} — ${esc(currentOp.description)}`}</h3>
      ${isOnHold ? `<p style="font-size:13px;color:var(--steel-200);margin:0;">On hold for ${holdHrs.toFixed(1)} h. Confirm to resume work and log the delay.</p>
        <label>Operator Name</label><input id="tvm_name" placeholder="Your name">`
        : `<label>Operator Name</label><input id="tvm_name" placeholder="Your name">
        <label>Reason</label><textarea id="tvm_reason" placeholder="e.g. wheel head not received"></textarea>
        <label>Department</label>
        <select id="tvm_resp"><option value="">— Select —</option>${tvResponsibilities.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select>`}
      <div class="tv-modal-actions">
        <button class="cancel" id="tvm_cancel">Cancel</button>
        <button class="confirm ${isOnHold?'resume':''}" id="tvm_confirm">${isOnHold?'Confirm Resume':'Confirm Hold'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('tvm_cancel').onclick = ()=> overlay.remove();
  document.getElementById('tvm_confirm').onclick = async ()=>{
    const name = document.getElementById('tvm_name').value.trim();
    if(!name){ toast('Enter operator name', true); return; }
    const today = new Date().toISOString().slice(0,10);
    let payload;
    if(isOnHold){
      payload = {
        job_id: s.job_id, job_operation_id: currentOp.op_id, primary_operator: name,
        activity_date: today, status: 'Partial', issue_reason: 'Resumed work',
        delay_hours: Number(holdHrs.toFixed(1)), responsibility: currentOp.last_responsibility || null
      };
    } else {
      const reason = document.getElementById('tvm_reason').value.trim();
      const resp = document.getElementById('tvm_resp').value;
      if(!reason){ toast('Enter a reason', true); return; }
      if(!resp){ toast('Select a department', true); return; }
      payload = {
        job_id: s.job_id, job_operation_id: currentOp.op_id, primary_operator: name,
        activity_date: today, status: 'Hold', issue_reason: reason, responsibility: resp
      };
    }
    const { error } = await sb.from('entries').insert(payload);
    if(error){ toast(error.message, true); return; }
    overlay.remove();
    toast(isOnHold ? 'Resumed' : 'Placed on hold');
    tvStations = await fetchStations();
    await renderStationCard(app, tvStations[idx] || tvStations[0], idx, tvStations.length);
  };
}

async function renderStationDisplay(app){
  document.body.classList.add('tv-mode');
  if(tvRotateTimer) clearInterval(tvRotateTimer);
  if(tvRefreshTimer) clearInterval(tvRefreshTimer);
  tvPaused = false;

  // Fixed pause/resume control pinned to the top of the screen — freezes rotation without
  // affecting the per-station Hold button or the rest of the card content.
  let bar = document.getElementById('tvRotateBar');
  if(!bar){ bar = document.createElement('div'); bar.id = 'tvRotateBar'; bar.className = 'tv-rotate-bar'; document.body.appendChild(bar); }
  function paintRotateBar(){
    bar.innerHTML = `<button class="tv-rotate-pause-btn ${tvPaused?'paused':''}" id="tvRotatePauseBtn">${tvPaused ? '▶ Resume Rotation' : '⏸ Pause Rotation'}</button>`;
    document.getElementById('tvRotatePauseBtn').onclick = ()=>{ tvPaused = !tvPaused; paintRotateBar(); };
  }
  paintRotateBar();

  tvStations = await fetchStations();
  tvIndex = 0;
  await renderStationCard(app, tvStations[0], 0, tvStations.length);

  tvRotateTimer = setInterval(async ()=>{
    if(tvPaused) return;
    if(tvStations.length===0) return;
    tvIndex = (tvIndex+1) % tvStations.length;
    await renderStationCard(app, tvStations[tvIndex], tvIndex, tvStations.length);
  }, tvInterval*1000);

  tvRefreshTimer = setInterval(async ()=>{
    if(tvPaused) return;
    tvStations = await fetchStations();
    if(tvIndex >= tvStations.length) tvIndex = 0;
    await renderStationCard(app, tvStations[tvIndex], tvIndex, tvStations.length);
  }, 60000); // re-pull fresh data every 60s regardless of rotation
}

boot();
</script>
</body>
</html>
