  const [deptRes, opsRes, issueRes, reasonsRes] = await Promise.all([
    sb.rpc('get_job_dept_delays', { p_job_id: s.job_id }),
    sb.rpc('get_job_operations_progress', { p_job_id: s.job_id }),
    sb.rpc('get_job_latest_issue', { p_job_id: s.job_id }),
    sb.rpc('get_job_top_delay_reasons', { p_job_id: s.job_id, p_limit: 20 })
  ]);
  const deptDelays = deptRes.data || [];
  const ops = opsRes.data || [];
  const latestIssue = (issueRes.data && issueRes.data[0]) || null;
  const allReasons = reasonsRes.data || [];

  const remainingHours = Math.max(0, (s.std_hours||0) - (s.earned_hours||0));
  const estDate = computeTargetDate(todayStr, remainingHours, s.shift_count, s.hours_per_shift);
  const risk = deliveryRiskLevel(estDate, s.delivery_date, 3);
  const riskLabel = risk==='ontrack' ? 'ON TRACK' : risk==='atrisk' ? 'AT RISK' : risk==='delayed' ? 'DELAYED' : 'STATUS UNKNOWN';
  const riskClass = risk || '';
  const riskSub = risk==='ontrack' ? 'Comfortably meeting the target delivery.' : risk==='atrisk' ? 'Slightly behind — within buffer.' : risk==='delayed' ? 'Delivery is at risk based on current projection.' : '';

  const daysDiff = (s.delivery_date && estDate) ? Math.round((new Date(estDate+'T00:00:00') - new Date(s.delivery_date+'T00:00:00'))/86400000) : null;
  const lateBadge = daysDiff===null ? '' : daysDiff>0 ? `<span class="late-badge delayed">DELAYED · ${daysDiff} DAY${daysDiff===1?'':'S'} LATE</span>`
    : daysDiff<0 ? `<span class="late-badge ontrack">AHEAD · ${Math.abs(daysDiff)} DAY${Math.abs(daysDiff)===1?'':'S'} EARLY</span>`
    : `<span class="late-badge ontrack">ON TIME</span>`;

  const totalMachinePct = (s.std_hours||0) > 0 ? Math.min(100, Math.round((s.earned_hours||0)/s.std_hours*100)) : 0;
  const workingDaysLeft = (()=>{
    if(!estDate) return 0;
    let d = new Date(todayStr+'T00:00:00'); const end = new Date(estDate+'T00:00:00');
    let count=0, guard=0;
    while(d<end && guard<3650){ d.setDate(d.getDate()+1); if(d.getDay()!==0) count++; guard++; }
    return count;
  })();

  const currentOpRow = ops.find(o=>o.op_no===s.current_op_no);
  const currentStatus = !currentOpRow ? 'Pending' : (currentOpRow.has_hold ? 'Hold' : (currentOpRow.actual_hours>0 ? 'InProgress' : 'Pending'));
  const currentStatusLabel = currentStatus==='InProgress' ? 'In Progress' : currentStatus;

  const totalDelay = allReasons.reduce((s2,r)=>s2+Number(r.total_hours||0),0) || (s.delay_hours_total||0) || 1;
  const top3Reasons = allReasons.slice(0,3);
  const otherReasonsHours = allReasons.slice(3).reduce((s2,r)=>s2+Number(r.total_hours||0),0);
  const rankColors = ['var(--red-600)','var(--red-600)','var(--amber-signal)'];

  const maxDept = Math.max(1, ...deptDelays.map(d=>Number(d.total_hours)||0));
  const totalDeptDelay = deptDelays.reduce((s2,d)=>s2+Number(d.total_hours||0),0) || 1;

  // Show a window centered on the current operation — a few done before it, it, and a few coming up —
  // instead of always the first 8, which made no sense once the job is deep into a long op list.
  const WINDOW_BEFORE = 4, WINDOW_AFTER = 4;
  const currentIdx = ops.findIndex(o=>o.op_no===s.current_op_no);
  let windowStart, windowEnd;
  if(currentIdx === -1){
    windowStart = 0; windowEnd = Math.min(ops.length, WINDOW_BEFORE+WINDOW_AFTER+1);
  } else {
    windowStart = Math.max(0, currentIdx - WINDOW_BEFORE);
    windowEnd = Math.min(ops.length, currentIdx + WINDOW_AFTER + 1);
  }
  const visibleOps = ops.slice(windowStart, windowEnd);
  const hiddenBeforeCt = windowStart;
  const hiddenAfterCt = ops.length - windowEnd;

  app.innerHTML = `
    <div class="tv-card" style="justify-content:flex-start;padding-top:24px;">

      <div class="tv-hbar">
        <div class="tv-hbar-item"><div class="lbl">Station</div><div class="val amber">${s.station_no ?? '—'} / ${idx+1}</div></div>
        <div class="tv-hbar-item"><div class="lbl">Machine</div><div class="val">${esc(s.machine_no)}</div></div>
        <div class="tv-hbar-item"><div class="lbl">Model</div><div class="val">${esc(s.model_name||'—')}</div></div>
        <div class="tv-hbar-item" style="flex:1;"><div class="lbl">Customer</div><div class="val" style="font-size:14px;">${esc(s.customer||'—')}</div></div>
        <div class="tv-hbar-item"><div class="lbl">Last Updated</div><div class="val" style="font-size:13px;">${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} · ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div>
        <div class="tv-hbar-status ${riskClass}">
          <div class="lbl">Overall Status</div>
          <div class="val">${riskLabel}</div>
          <div class="sub">${riskSub}</div>
        </div>
      </div>

      <div class="tv-row2">
        <div class="tv-panel">
          <div class="tv-table-title">Current Operation</div>
          <div class="tv-curop-title">${s.current_op_no ? esc(s.current_op_no)+' — '+esc(s.current_op_description||'') : 'All operations completed'}</div>
          <span class="tv-op-status-pill ${currentStatus}">${esc(currentStatusLabel)}</span>
        </div>
        ${latestIssue ? `
        <div class="tv-panel tv-issue-panel">
          <div class="hdr">⚠ Current Issue (Latest)</div>
          <div class="issue-text">${esc(latestIssue.issue_reason)}</div>
          <div class="issue-meta">
            <div>REPORTED<b style="font-size:12px;">${new Date(latestIssue.submitted_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} · ${new Date(latestIssue.submitted_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</b></div>
            <div>RESPONSIBLE<b style="font-size:12px;">${esc(latestIssue.responsibility||'—')}</b></div>
          </div>
        </div>` : `<div class="tv-panel"><div class="tv-table-title">Current Issue</div><div class="tv-table-empty">No open issue logged</div></div>`}
      </div>

      <div class="tv-metric-row">
        <div class="tv-mw">
          <div class="lbl">Overall Progress</div>
          <div class="tv-mw-donut-wrap">
            <div class="tv-mw-donut-canvas-wrap"><canvas id="progressDonut"></canvas><div class="tv-mw-donut-pct">${totalMachinePct}%</div></div>
            <div class="caption">${(s.earned_hours||0).toFixed(1)}h of ${(s.std_hours||0).toFixed(1)}h</div>
          </div>
        </div>
        <div class="tv-mw">
          <div class="lbl">Actual vs Planned Hours</div>
          <div class="big split"><b>${(s.actual_hours||0).toFixed(0)}h</b><span class="slash">/</span>${(s.std_hours||0).toFixed(0)}h</div>
          <div class="caption">Actual / Planned (Std)</div>
        </div>
        <div class="tv-mw">
          <div class="lbl">Delay Hours</div>
          <div class="big red">${(s.delay_hours_total||0).toFixed(0)}h</div>
          <div class="caption">Across all operations</div>
        </div>
        <div class="tv-mw">
          <div class="lbl">Est. Delivery</div>
          <div class="big ${risk==='delayed'?'red':''}" style="font-size:19px;">${fmtDate(estDate)}</div>
          <div class="caption">Plan: ${fmtDate(s.delivery_date)}</div>
          ${lateBadge}
        </div>
      </div>

      <div class="tv-row2">
        <div class="tv-panel">
          <div class="tv-table-title">Operation Progress (${ops.length} operations)</div>
          ${hiddenBeforeCt>0 ? `<div class="tv-more-ops-note">↑ ${hiddenBeforeCt} earlier operation${hiddenBeforeCt===1?'':'s'} completed</div>` : ''}
          <table class="tv-ops tv-ops-compact">
            <tr><th>Op</th><th>Operation</th><th>Progress</th><th>Status</th></tr>
            ${visibleOps.map(o=>{
              const pct = o.is_completed ? 100 : (o.std_hours>0 ? Math.min(100, Math.round(o.actual_hours/o.std_hours*100)) : 0);
              const st = o.is_completed ? 'Completed' : (o.op_no===s.current_op_no ? currentStatusLabel : (o.has_hold ? 'Hold' : 'Pending'));
              return `<tr class="${o.op_no===s.current_op_no?'current':''}">
                <td>${esc(o.op_no)}</td><td class="name">${esc(o.description)}</td>
                <td><span class="tv-mini-pct-bar"><span class="tv-mini-pct-fill" style="width:${pct}%;"></span></span>${pct}%</td>
                <td><span class="tv-op-status-pill ${st==='In Progress'?'InProgress':st}" style="margin:0;">${esc(st)}</span></td>
              </tr>`;
            }).join('') || '<tr><td colspan="4" class="tv-table-empty">No operations set up yet</td></tr>'}
          </table>
          ${hiddenAfterCt>0 ? `<div class="tv-more-ops-note">↓ ${hiddenAfterCt} more operation${hiddenAfterCt===1?'':'s'} remaining</div>` : ''}
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="tv-panel">
            <div class="tv-table-title">Top 3 Delay Reasons <span style="font-weight:400;text-transform:none;color:var(--steel-300);">(share of ${totalDelay.toFixed(1)}h total delay)</span></div>
            <div class="tv-reason-rank">
              ${top3Reasons.length ? top3Reasons.map((r,i)=>`
                <div class="tv-reason-rank-row">
                  <div class="tv-reason-rank-badge" style="background:${rankColors[i]};">${i+1}</div>
                  <div class="tv-reason-rank-txt">${esc(r.issue_reason)}</div>
                  <div class="tv-reason-rank-val">${Number(r.total_hours).toFixed(1)}h (${Math.round(Number(r.total_hours)/totalDelay*100)}%)</div>
                </div>`).join('') : '<div class="tv-table-empty">No delays logged</div>'}
              ${otherReasonsHours>0 ? `<div class="tv-reason-rank-other"><span>All other reasons</span><span>${otherReasonsHours.toFixed(1)}h (${Math.round(otherReasonsHours/totalDelay*100)}%)</span></div>` : ''}
            </div>
          </div>
          <div class="tv-panel">
            <div class="tv-table-title">Delay by Department <span style="font-weight:400;text-transform:none;color:var(--steel-300);">(total ${totalDeptDelay.toFixed(1)}h)</span></div>
            ${deptDelays.length ? deptDelays.map((d,i)=>`
              <div class="tv-bar-row">
                <div class="tv-bar-label">${esc(d.responsibility)}</div>
                <div class="tv-bar-track"><div class="tv-bar-fill" style="width:${Math.round(Number(d.total_hours)/maxDept*100)}%;background:${TV_DEPT_COLORS[i%TV_DEPT_COLORS.length]};"></div></div>
                <div class="tv-bar-val">${Number(d.total_hours).toFixed(1)}h (${Math.round(Number(d.total_hours)/totalDeptDelay*100)}%)</div>
              </div>`).join('') : '<div class="tv-table-empty">No delays logged</div>'}
          </div>
        </div>
      </div>

      <div class="tv-hbar" style="margin-top:14px;">
        <div class="tv-hbar-item"><div class="lbl">Shift Capacity</div><div class="val" style="font-size:15px;">${s.shift_count||1} shift × ${(s.hours_per_shift||8)}h = ${((s.shift_count||1)*(s.hours_per_shift||8)).toFixed(1)}h/day</div></div>
        <div class="tv-hbar-item"><div class="lbl">Working Days Left</div><div class="val">${workingDaysLeft} Days</div></div>
        <div class="tv-hbar-item"><div class="lbl">Efficiency</div><div class="val amber">${(s.efficiency_pct===null || (s.actual_hours||0)<0.5) ? '—' : (s.efficiency_pct>300 ? '300%+' : s.efficiency_pct+'%')}</div></div>
        <div class="tv-hbar-item"><div class="lbl">Remaining Hours</div><div class="val">${remainingHours.toFixed(1)}h <span style="font-size:10px;color:var(--steel-300);font-weight:400;">to complete</span></div></div>
      </div>

    </div>
  `;

  if(window.__tvDonutChart) window.__tvDonutChart.destroy();
  const donutCanvas = document.getElementById('progressDonut');
  if(donutCanvas){
    window.__tvDonutChart = new Chart(donutCanvas, {
      type:'doughnut',
      data:{ datasets:[{ data:[totalMachinePct, 100-totalMachinePct], backgroundColor:['#4a90a4','rgba(255,255,255,.08)'], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'70%', plugins:{legend:{display:false},tooltip:{enabled:false}} }
    });
  }
}
async function renderStationDisplay(app){
  document.body.classList.add('tv-mode');
  if(tvRotateTimer) clearInterval(tvRotateTimer);
  if(tvRefreshTimer) clearInterval(tvRefreshTimer);

  tvStations = await fetchStations();
  tvIndex = 0;
  await renderStationCard(app, tvStations[0], 0, tvStations.length);

  tvRotateTimer = setInterval(async ()=>{
    if(tvStations.length===0) return;
    tvIndex = (tvIndex+1) % tvStations.length;
    await renderStationCard(app, tvStations[tvIndex], tvIndex, tvStations.length);
  }, tvInterval*1000);

  tvRefreshTimer = setInterval(async ()=>{
    tvStations = await fetchStations();
    if(tvIndex >= tvStations.length) tvIndex = 0;
    await renderStationCard(app, tvStations[tvIndex], tvIndex, tvStations.length);
  }, 60000); // re-pull fresh data every 60s regardless of rotation
}

boot();
</script>
</body>
</html>
