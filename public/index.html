<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Shopfloor Job Card System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --graphite-950:#1a1e22;
    --graphite-800:#262d33;
    --steel-700:#3d4a55;
    --steel-600:#57687a;
    --steel-300:#a7b3bd;
    --steel-200:#c7cfd6;
    --plate-50:#f2f3f1;
    --plate-100:#e8eae6;
    --amber-500:#f2a30f;
    --amber-600:#d68f0a;
    --amber-700:#8a5e08;
    --green-600:#3f8f63;
    --green-100:#e0f0e7;
    --amber-signal:#e0a300;
    --amber-100:#faedd1;
    --red-600:#c0392b;
    --red-100:#fae3e0;
    --font-display:'Oswald',Arial,sans-serif;
    --font-body:'Inter',Arial,sans-serif;
    --font-mono:'IBM Plex Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{margin:0;background:var(--plate-50);font-family:var(--font-body);color:var(--graphite-950);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  /* ---------- topbar ---------- */
  .topbar{
    background:var(--graphite-950);color:#fff;padding:14px 20px 12px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    position:relative;
  }
  .topbar::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
    background:repeating-linear-gradient(135deg,var(--amber-500) 0 10px,var(--graphite-950) 10px 20px);
    opacity:.9;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;
    text-transform:uppercase;letter-spacing:1.5px;font-size:15px;}
  .brand .lamp{width:9px;height:9px;}
  .nav{display:flex;gap:4px;flex-wrap:wrap;}
  .nav button{
    background:transparent;border:1px solid var(--steel-700);color:var(--steel-300);
    padding:8px 13px;font-size:12px;font-family:var(--font-body);font-weight:600;
    text-transform:uppercase;letter-spacing:.4px;border-radius:2px;cursor:pointer;
  }
  .nav button.active{background:var(--amber-500);color:var(--graphite-950);border-color:var(--amber-500);}
  .nav button:hover:not(.active){border-color:var(--steel-300);color:#fff;}
  .nav button:focus-visible{outline:2px solid var(--amber-500);outline-offset:2px;}

  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 70px;}

  /* ---------- panels ---------- */
  .panel{background:#fff;border:1px solid var(--plate-100);border-left:3px solid var(--steel-700);
    border-radius:3px;padding:20px 22px;margin-bottom:16px;}
  .panel-title{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--graphite-950);margin:0 0 14px;padding-bottom:9px;border-bottom:2px solid var(--graphite-950);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600;}
  .panel-title .sub{font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--steel-600);
    text-transform:none;letter-spacing:0;}

  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--steel-600);
    margin:14px 0 5px;font-weight:600;}
  input,select,textarea{
    width:100%;padding:12px 11px;font-size:15px;border:1.5px solid var(--steel-200);border-radius:3px;
    background:var(--plate-50);font-family:var(--font-body);color:var(--graphite-950);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber-500);outline-offset:0;border-color:var(--amber-500);}
  textarea{min-height:74px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
  @media(max-width:560px){.row2,.row3{grid-template-columns:1fr;}}

  /* ---------- buttons ---------- */
  .btn{display:inline-block;background:var(--graphite-950);color:#fff;border:none;padding:13px 22px;
    font-size:13px;font-weight:700;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.5px;
    border-radius:3px;cursor:pointer;margin-top:16px;}
  .btn.amber{background:var(--amber-500);color:var(--graphite-950);}
  .btn.amber:hover{background:var(--amber-600);}
  .btn.ghost{background:transparent;color:var(--graphite-950);border:1.5px solid var(--graphite-950);}
  .btn.red{background:var(--red-600);color:#fff;}
  .btn.small{padding:8px 13px;font-size:11px;margin-top:0;}
  .modal-overlay{position:fixed;inset:0;background:rgba(26,30,34,0.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .modal-box{background:#fff;border-radius:10px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .modal-box h3{margin:0 0 10px;font-family:var(--font-head);font-size:16px;color:var(--graphite-950);}
  .modal-box p{margin:0 0 20px;font-size:13.5px;line-height:1.5;color:var(--steel-700);}
  .modal-box .modal-actions{display:flex;flex-direction:column;gap:8px;}
  .btn:focus-visible{outline:2px solid var(--amber-500);outline-offset:2px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- andon lamp (signature status element) ---------- */
  .lamp{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block;position:relative;}
  .lamp.green{background:var(--green-600);box-shadow:0 0 6px 1px rgba(63,143,99,.55);}
  .lamp.amber{background:var(--amber-signal);box-shadow:0 0 6px 1px rgba(224,163,0,.55);}
  .lamp.red{background:var(--red-600);box-shadow:0 0 7px 2px rgba(192,57,43,.6);}
  .lamp.grey{background:var(--steel-300);}
  .lamp.red.pulse{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

  .status-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px;padding:3px 9px 3px 7px;border-radius:11px;}
  .status-tag.Completed{background:var(--green-100);color:var(--green-600);}
  .status-tag.Partial{background:var(--amber-100);color:var(--amber-700);}
  .status-tag.Hold{background:var(--red-100);color:var(--red-600);}
  .status-tag.NotStarted{background:var(--plate-100);color:var(--steel-600);}

  /* ---------- nameplate (signature identity element) ---------- */
  .nameplate{
    position:relative;border-radius:5px;padding:18px 22px;margin-bottom:16px;color:#eef1f0;
    background:linear-gradient(155deg,var(--steel-700) 0%,var(--graphite-800) 55%,var(--graphite-950) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.25);
  }
  .nameplate::before,.nameplate::after,.nameplate .rv2,.nameplate .rv3{
    content:'';position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #dfe4e6, #7c8892 70%);
    box-shadow:0 1px 1px rgba(0,0,0,.5);
  }
  .nameplate::before{top:8px;left:8px;}
  .nameplate::after{top:8px;right:8px;}
  .nameplate .rv2{bottom:8px;left:8px;}
  .nameplate .rv3{bottom:8px;right:8px;}
  .nameplate .np-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,.1);}
  .nameplate .np-row:last-child{border:none;}
  .nameplate .np-row span{color:#aab6bd;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;
    font-weight:600;align-self:center;}
  .nameplate .np-row b{font-family:var(--font-display);font-weight:600;letter-spacing:.4px;
    text-shadow:0 1px 0 rgba(0,0,0,.4);font-size:15px;}

  /* ---------- op list rows ---------- */
  .op-row{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--plate-100);font-size:13px;}
  .op-row:last-child{border-bottom:none;}
  .op-row .grp{font-family:var(--font-mono);font-size:10px;background:var(--steel-700);color:#fff;
    padding:3px 7px;border-radius:2px;min-width:84px;text-align:center;flex-shrink:0;}
  .op-row .desc{flex:1;}
  .op-row .opno{font-family:var(--font-mono);color:var(--steel-600);}
  .op-row .mini{width:58px;padding:6px;font-size:12px;flex-shrink:0;font-family:var(--font-mono);}
  .op-row .exec-select{width:88px;padding:6px 4px;font-size:11px;flex-shrink:0;}
  .op-row button{background:none;border:none;color:var(--red-600);font-size:16px;cursor:pointer;flex-shrink:0;padding:0 3px;}
  .op-row .up-down{display:flex;flex-direction:column;flex-shrink:0;}
  .op-row .up-down button{color:var(--steel-600);font-size:10px;line-height:1.1;}
  .op-row .drag-handle{cursor:grab;color:var(--steel-300);font-size:16px;flex-shrink:0;user-select:none;}
  .op-row.dragging{opacity:.35;}
  .op-row.drag-over{border-top:2px solid var(--amber-500);}
  .exec-pill{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 6px;border-radius:8px;flex-shrink:0;}
  .exec-pill.Series{background:var(--plate-100);color:var(--steel-600);}
  .exec-pill.Parallel{background:var(--amber-100);color:var(--amber-700);}

  /* ---------- job card (Jobs / QR Labels list) ---------- */
  .job-card{border-bottom:1px solid var(--plate-100);padding:12px 4px;}
  .job-card:last-child{border-bottom:none;}
  .job-card .job-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .job-card .job-head b{font-size:14px;}
  .job-card .job-head .model-tag{font-family:var(--font-mono);font-size:10px;background:var(--steel-700);color:#fff;padding:2px 7px;border-radius:2px;}
  .job-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .job-actions button{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:6px 11px;
    border-radius:3px;border:1.5px solid var(--steel-200);background:#fff;cursor:pointer;color:var(--graphite-950);
  }
  .job-actions button.warn{border-color:var(--amber-signal);color:var(--amber-700);}
  .job-actions button.danger{border-color:var(--red-600);color:var(--red-600);}
  .job-actions button:hover{background:var(--plate-50);}
  .model-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--steel-600);margin-top:4px;font-family:var(--font-mono);}

  /* ---------- KPI strip (dashboard overview) ---------- */
  .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:640px){.kpi-strip{grid-template-columns:1fr 1fr;}}
  .kpi-card{background:var(--plate-50);border:1px solid var(--plate-100);border-radius:4px;padding:14px 12px;text-align:center;}
  .kpi-card.warn{background:var(--red-100);border-color:var(--red-600);}
  .kpi-num{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--graphite-950);}
  .kpi-card.warn .kpi-num{color:var(--red-600);}
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--steel-600);margin-top:2px;}

  /* ---------- sticky-header table scroll container ---------- */
  .table-scroll{max-height:520px;overflow-y:auto;overflow-x:auto;border:1px solid var(--plate-100);}
  .table-scroll table.entries th{position:sticky;top:0;z-index:1;}
  tr.hold-row td{background:var(--red-100);}
  tr.hold-row:hover td{background:#f6d4cf;}

  /* ---------- section headers (mini KPI strips + charts) ---------- */
  .section-header{background:var(--plate-50);border:1px solid var(--plate-100);border-radius:4px;padding:14px;margin-bottom:14px;}
  .mini-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  @media(max-width:640px){.mini-kpi-row{grid-template-columns:1fr 1fr;}}
  .mini-kpi{background:#fff;border:1px solid var(--plate-100);border-radius:3px;padding:10px;text-align:center;}
  .mini-kpi .num{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--graphite-950);}
  .mini-kpi .lbl{font-size:10px;text-transform:uppercase;color:var(--steel-600);letter-spacing:.3px;margin-top:2px;}
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:720px){.chart-row{grid-template-columns:1fr;}}
  .chart-box{background:#fff;border:1px solid var(--plate-100);border-radius:3px;padding:10px;}
  .chart-box canvas{max-height:220px;}
  .ranked-list{font-size:12.5px;}
  .ranked-row{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--plate-100);}
  .ranked-row:last-child{border-bottom:none;}
  .date-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .date-presets button{padding:6px 12px;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:12px;
    border:1.5px solid var(--steel-200);background:#fff;cursor:pointer;color:var(--steel-600);}
  .date-presets button.on{background:var(--graphite-950);color:#fff;border-color:var(--graphite-950);}
  table.eff th{text-align:left;background:var(--steel-700);color:#fff;padding:7px 6px;font-size:10px;text-transform:uppercase;}
  table.eff td{padding:6px;border-bottom:1px solid var(--plate-100);font-size:12px;}
  table.eff{width:100%;border-collapse:collapse;}

  /* ---------- paste-from-excel ---------- */
  .paste-box{margin-top:10px;padding:12px;background:var(--plate-50);border:1.5px dashed var(--steel-200);border-radius:3px;}
  .paste-box textarea{min-height:100px;font-family:var(--font-mono);font-size:12px;}

  /* ---------- toggle pair (New Job: copy ops or blank) ---------- */
  .toggle-pair{display:flex;gap:8px;margin-top:6px;}
  .toggle-pair button{flex:1;padding:12px 8px;border-radius:3px;border:1.5px solid var(--steel-200);background:#fff;
    font-family:var(--font-body);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;
    cursor:pointer;color:var(--steel-600);}
  .toggle-pair button.on{border-color:var(--graphite-950);background:var(--graphite-950);color:#fff;}

  /* ---------- print profile buttons ---------- */
  .print-profiles{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;}
  .print-profile-cap{font-size:11px;color:var(--steel-600);margin-top:5px;max-width:220px;line-height:1.4;}

  /* ---------- Station Display (rotating floor TV) ---------- */
  body.tv-mode{background:var(--graphite-950);}
  body.tv-mode .topbar{display:none;}
  body.tv-mode .wrap{max-width:none;padding:0;}
  .tv-empty{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;background:var(--graphite-950);}

  .tv-card{
    min-height:100vh;background:var(--graphite-950);color:#fff;
    padding:18px 22px 30px;box-sizing:border-box;font-size:14px;
  }
  .tv-card *{box-sizing:border-box;}

  /* header row */
  .tv-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
    border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:16px;margin-bottom:16px;flex-wrap:wrap;}
  .tv-head-left{min-width:150px;}
  .tv-station-no{font-family:var(--font-mono);font-size:13px;color:var(--amber-500);letter-spacing:2px;text-transform:uppercase;}
  .tv-progress{color:var(--steel-300);margin-left:8px;}
  .tv-machine{font-family:var(--font-display);font-size:clamp(30px,5vw,56px);font-weight:700;letter-spacing:1px;line-height:1.05;margin-top:2px;}
  .tv-sub{font-size:14px;color:var(--steel-200);margin-top:4px;}

  .tv-head-center{flex:1;min-width:280px;}
  .tv-op-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--steel-300);margin-bottom:4px;}
  .tv-op-name{font-size:clamp(18px,2.4vw,26px);font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .tv-op-name .opno{color:var(--red-600);}
  .tv-op-name.status-InProgress .opno,.tv-op-name.status-Pending .opno{color:var(--amber-500);}
  .tv-op-tags{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .tv-status-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:4px;
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .tv-status-pill.Hold{background:var(--red-600);color:#fff;}
  .tv-status-pill.Hold .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite;}
  .tv-status-pill.Running{background:rgba(63,143,99,.18);color:#8fd6ac;border:1px solid rgba(63,143,99,.5);}
  .tv-status-pill.Running .dot{width:9px;height:9px;border-radius:50%;background:var(--green-600);}
  .tv-hold-duration{color:var(--red-600);font-weight:700;font-size:14px;}

  .tv-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:170px;}
  .tv-updated{font-size:10.5px;color:var(--steel-300);text-transform:uppercase;letter-spacing:.5px;text-align:right;line-height:1.5;}
  .tv-updated b{display:block;color:#fff;font-size:12.5px;letter-spacing:0;text-transform:none;}
  .tv-pause-btn{border:none;border-radius:5px;padding:14px 26px;font-family:var(--font-body);font-weight:700;
    font-size:14px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:9px;}
  .tv-pause-btn.hold-active{background:var(--red-600);color:#fff;}
  .tv-pause-btn.hold-active:hover{background:#a63226;}
  .tv-pause-btn.resume{background:var(--green-600);color:#fff;}
  .tv-pause-btn.resume:hover{background:#347a54;}
  .tv-pause-btn .dot{width:10px;height:10px;border-radius:50%;background:#fff;}

  /* rotation pause/resume — fixed at top of TV screen, independent of the rotating card */
  .tv-rotate-bar{position:fixed;top:12px;right:14px;z-index:500;}
  .tv-rotate-pause-btn{border:none;border-radius:5px;padding:9px 16px;font-family:var(--font-body);font-weight:700;
    font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .tv-rotate-pause-btn:hover{background:rgba(255,255,255,.2);}
  .tv-rotate-pause-btn.paused{background:var(--amber-500);color:var(--graphite-950);}

  /* metric strip */
  .tv-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px;}
  @media(max-width:1100px){.tv-metrics{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:640px){.tv-metrics{grid-template-columns:repeat(2,1fr);}}
  .tv-metric{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:14px 16px;}
  .tv-metric-lbl{font-size:10.5px;text-transform:uppercase;color:var(--steel-300);letter-spacing:.8px;display:flex;align-items:center;gap:7px;}
  .tv-metric-num{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:6px;}
  .tv-metric.highlight .tv-metric-num,.tv-metric.highlight .tv-metric-lbl{color:var(--amber-500);}
  .tv-metric.warn .tv-metric-num,.tv-metric.warn .tv-metric-lbl{color:var(--red-600);}

  /* operation progress timeline */
  .tv-progress-panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:7px;
    padding:16px 18px 14px;margin-bottom:18px;}
  .tv-progress-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--steel-300);margin-bottom:14px;}
  .tv-timeline{display:flex;align-items:center;overflow-x:auto;padding-bottom:6px;gap:0;}
  .tv-node-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:52px;}
  .tv-node{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:11px;font-weight:600;border:2px solid var(--steel-600);color:var(--steel-300);
    background:rgba(255,255,255,.03);flex-shrink:0;position:relative;z-index:1;}
  .tv-node.Completed{background:var(--green-600);border-color:var(--green-600);color:#fff;}
  .tv-node.InProgress{background:rgba(66,133,244,.15);border-color:#4285f4;color:#8ab4ff;}
  .tv-node.Hold{background:var(--red-600);border-color:var(--red-600);color:#fff;}
  .tv-connector{height:2px;background:var(--steel-700);flex:1;min-width:16px;margin:0 -1px;}

function toast(msg, isErr){

function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lampClass(status){ return status==='Completed'?'green':status==='Partial'?'amber':status==='Hold'?'red':status==='Not Started'?'grey':'grey'; }
function statusCss(status){ return (status||'').replace(/\s+/g,''); } // css-safe class name for statuses like "Not Started"

// Reusable two-choice modal. Returns a promise resolving 'a' or 'b' depending which button was clicked.
function showChoiceModal({title, body, choiceA, choiceB}){

// Prevents double-submit: disables the button and swaps its label while fn() runs,
// restores it afterward (success or failure) unless the button was replaced by a re-render.
async function withLock(btn, busyLabel, fn){
  if(!btn || btn.disabled) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyLabel || 'Working…';
  try{ await fn(); }
  finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = original; } }
}

/* ================= Excel import/export helpers ================= */
function exportOpsToExcel(list, filename){
  const ws = XLSX.utils.json_to_sheet(list.map(o=>({OpNo:o.op_no,Group:o.group_name,Description:o.description,StdHours:o.std_hours,StdManpower:o.std_manpower})));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Operations');
  XLSX.writeFile(wb, filename);
}
function importOpsFromExcel(file, onDone){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      const list = rows.map(r=>({
        op_no:(r.OpNo ?? r['Op No'] ?? '').toString(),
        group_name:(r.Group ?? r['Group Name'] ?? '').toString(),
        description:(r.Description ?? '').toString(),
        std_hours:parseFloat(r.StdHours ?? r['Std Hours'] ?? 0) || 0,
        std_manpower:parseInt(r.StdManpower ?? r['Std Manpower'] ?? 1) || 1
      })).filter(r=>r.description);
      if(list.length===0){ toast('No valid rows found — expected columns OpNo, Group, Description, StdHours, StdManpower', true); return; }
      onDone(list);
      toast('Imported '+list.length+' operations');
    }catch(err){ toast('Import failed: '+err.message, true); }
  };
  reader.readAsArrayBuffer(file);
}

async function renderModels(app){

      <div id="modelList"></div>

/* ================= JOB DETAILS EDITOR (machine no, customer, dates) ================= */
async function openJobDetailsEditor(job, app){
  const panel = document.getElementById('opsPanel');
  panel.style.display='block';
  const { data: ops } = await sb.from('job_operations').select('std_hours, is_completed').eq('job_id', job.id);
  const opList = ops || [];
  const totalStdHours = opList.reduce((s,o)=> s + (parseFloat(o.std_hours)||0), 0);
  const doneStdHours = opList.filter(o=>o.is_completed).reduce((s,o)=> s + (parseFloat(o.std_hours)||0), 0);
  const remainingStdHours = Math.max(0, totalStdHours - doneStdHours);
  const shiftCount = job.shift_count || 1;
  const hoursPerShift = job.hours_per_shift || 7.5;

  function renderCalc(){
    const sc = parseFloat(document.getElementById('ed_shifts').value)||1;
    const hs = parseFloat(document.getElementById('ed_hrsday').value)||7.5;
    const startForTarget = job.actual_start_date || job.start_date;
    const targetDate = startForTarget ? computeTargetDate(startForTarget, totalStdHours, sc, hs) : null;
    const tomorrow = addDaysStr(new Date().toISOString().slice(0,10), 1);
    const estDeliveryDate = remainingStdHours>0 ? computeTargetDate(tomorrow, remainingStdHours, sc, hs) : tomorrow;
    const risk = deliveryRiskLevel(estDeliveryDate, job.delivery_date);
    const riskLabel = risk==='green' ? '✓ ON / BEFORE SO DATE' : risk==='yellow' ? '⚠ LATE (WITHIN BUFFER)' : risk==='red' ? '✕ LATE (BEYOND BUFFER)' : '—';
    const riskColor = risk==='green' ? 'var(--green-600)' : risk==='yellow' ? 'var(--amber-signal)' : risk==='red' ? 'var(--red-600)' : 'var(--steel-600)';
    document.getElementById('calcOut').innerHTML = `

/* ================= SHARED OPERATIONS EDITOR ================= */
async function openOpsEditor({ title, loadFn, saveFn, filenamePrefix }){
  const panel = document.getElementById('opsPanel');
  panel.style.display='block';
  panel.innerHTML = `<div class="empty">Loading operations…</div>`;
  let list = (await loadFn() || []).map(o=>({...o}));
  let firstPaint = true;

  function paint(){
    if(!firstPaint) unsavedOpsDirty = true; else firstPaint = false;
    const totalOps = list.length;
    const totalStdHours = list.reduce((s,o)=> s + (parseFloat(o.std_hours)||0), 0);
    const totalLabourHours = list.reduce((s,o)=> s + (parseFloat(o.std_hours)||0) * (parseInt(o.std_manpower)||1), 0);
    panel.innerHTML = `
      <div class="panel-title">${esc(title)}
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn ghost small" id="pasteBtn" type="button">Paste from Excel</button>
          <label class="file-btn" style="margin:0;">Import File
            <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none;">
          </label>
          <button class="btn ghost small" id="exportOpsBtn">Export Excel</button>
          <button class="btn ghost small" id="closeOpsBtn" type="button">Close</button>
        </div>
      </div>
      <div class="stat-line" style="display:flex;gap:18px;flex-wrap:wrap;">
        <span><b style="color:var(--graphite-950);">${totalOps}</b> operations</span>
        <span><b style="color:var(--graphite-950);">${totalStdHours.toFixed(1)}h</b> total std hours</span>
        <span><b style="color:var(--graphite-950);">${totalLabourHours.toFixed(1)}h</b> total labour hours (std hours × manpower)</span>
      </div>
      <div class="paste-box" id="pasteBox" style="display:none;">
        <label style="margin:0 0 6px;">Paste cells copied from Excel <span style="text-transform:none;font-weight:400;">(columns: Op No, Group, Description, Std Hours, Std Manpower — header row optional)</span></label>
        <textarea id="pasteInput" placeholder="10&#9;Caracas&#9;Bed Resting On Pad&#9;2&#9;1"></textarea>
        <button class="btn small" id="parsePasteBtn" type="button" style="margin-top:8px;">Add Pasted Rows</button>
      </div>
      <div id="opsList"></div>
      <div class="row3" style="margin-top:10px;">
        <div><label>Op No.</label><input id="a_op" placeholder="310"></div>
        <div><label>Group</label><input id="a_grp" placeholder="Group"></div>
        <div><label>Description</label><input id="a_desc" placeholder="Operation description"></div>
      </div>
      <div class="row3">
        <div><label>Std Hours</label><input id="a_hrs" placeholder="7.5"></div>
        <div><label>Std Manpower</label><input id="a_man" placeholder="1"></div>
        <div><label>Execution</label>
          <select id="a_exec"><option value="Series">Series</option><option value="Parallel">Parallel</option></select>
        </div>
      </div>
      <button class="btn small" id="addOpBtn" style="margin-top:10px;">+ Add Operation</button>
      <button class="btn amber" id="saveOpsBtn" style="width:100%;text-align:center;">Save Changes</button>
    `;
    document.getElementById('opsList').innerHTML = list.map((o,i)=>`
      <div class="op-row" draggable="true" data-idx="${i}">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <div class="up-down"><button data-up="${i}" title="Move up">▲</button><button data-down="${i}" title="Move down">▼</button></div>
        <span class="grp">${esc(o.group_name||'')}</span>
        <span class="desc">${o.is_completed?'<span class="status-tag Completed" style="margin-right:6px;">✓ Done</span>':''}<span class="opno">${esc(o.op_no)}</span> — ${esc(o.description)}</span>
        <span class="exec-pill ${o.execution_mode==='Parallel'?'Parallel':'Series'}">${o.execution_mode==='Parallel'?'Parallel':'Series'}</span>
        <select class="exec-select" data-exec="${i}">
          <option value="Series" ${o.execution_mode!=='Parallel'?'selected':''}>Series</option>
          <option value="Parallel" ${o.execution_mode==='Parallel'?'selected':''}>Parallel</option>
        </select>
        <input class="mini" data-hrs="${i}" value="${o.std_hours||''}" title="Std Hours">
        <input class="mini" data-man="${i}" value="${o.std_manpower||1}" title="Std Manpower">
        <button data-del="${i}" title="Remove">✕</button>
      </div>`).join('') || '<div class="empty">No operations yet — add below, paste from Excel, or import a file.</div>';

    panel.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [list[i-1],list[i]]=[list[i],list[i-1]]; paint(); }});
    panel.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.down; if(i<list.length-1){ [list[i+1],list[i]]=[list[i],list[i+1]]; paint(); }});
    panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ list.splice(+b.dataset.del,1); paint(); });
    panel.querySelectorAll('[data-hrs]').forEach(inp=>inp.onchange=()=>{ list[+inp.dataset.hrs].std_hours=parseFloat(inp.value)||0; unsavedOpsDirty=true; });
    panel.querySelectorAll('[data-man]').forEach(inp=>inp.onchange=()=>{ list[+inp.dataset.man].std_manpower=parseInt(inp.value)||1; unsavedOpsDirty=true; });
    panel.querySelectorAll('[data-exec]').forEach(sel=>sel.onchange=()=>{ list[+sel.dataset.exec].execution_mode=sel.value; paint(); });

    // drag-and-drop reordering
    let dragSrc = null;
    panel.querySelectorAll('.op-row').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragSrc = +row.dataset.idx; row.classList.add('dragging'); });
      row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); panel.querySelectorAll('.op-row').forEach(r=>r.classList.remove('drag-over')); });
      row.addEventListener('dragover', (e)=>{ e.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('drag-over'));
      row.addEventListener('drop', (e)=>{
        e.preventDefault();
        const destIdx = +row.dataset.idx;
        if(dragSrc===null || dragSrc===destIdx) return;
        const [moved] = list.splice(dragSrc,1);
        list.splice(destIdx,0,moved);
        paint();
      });
    });

    document.getElementById('addOpBtn').onclick=()=>{
      const op=document.getElementById('a_op').value.trim();
      const grp=document.getElementById('a_grp').value.trim();
      const desc=document.getElementById('a_desc').value.trim();
      const hrs=parseFloat(document.getElementById('a_hrs').value)||0;
      const man=parseInt(document.getElementById('a_man').value)||1;
      const exec=document.getElementById('a_exec').value;
      if(!desc) return toast('Enter a description', true);
      list.push({op_no:op, group_name:grp, description:desc, std_hours:hrs, std_manpower:man, execution_mode:exec, sequence:list.length});
      paint();
    };
    document.getElementById('exportOpsBtn').onclick=()=> exportOpsToExcel(list, filenamePrefix+'_operations.xlsx');
    document.getElementById('importFile').onchange=(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      importOpsFromExcel(file, (imported)=>{ list = list.concat(imported.map(o=>({...o, sequence:list.length}))); paint(); });
    };
    document.getElementById('pasteBtn').onclick=()=>{
      const box = document.getElementById('pasteBox');
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    };
    document.getElementById('parsePasteBtn').onclick=()=>{
      const text = document.getElementById('pasteInput').value;
      const parsed = parsePastedExcel(text);
      if(parsed.length===0){ toast('No valid rows found in pasted text', true); return; }
      list = list.concat(parsed.map(o=>({...o, sequence:list.length})));
      document.getElementById('pasteInput').value='';
      toast('Added '+parsed.length+' rows');
      paint();
    };
    document.getElementById('closeOpsBtn').onclick = ()=>{
      if(unsavedOpsDirty && !confirm('Unsaved changes will be lost. Close anyway?')) return;
      unsavedOpsDirty = false;
      panel.style.display='none';
      panel.innerHTML='';
    };
    document.getElementById('saveOpsBtn').onclick = (e)=> withLock(e.target, 'Saving…', async ()=>{
      const { error } = await saveFn(list);
      if(error) return toast(error.message, true);
      unsavedOpsDirty = false;
      toast('Saved');
    });
  }
  paint();
}

function parsePastedExcel(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(lines.length===0) return [];
  let rows = lines.map(l=>l.split('\t'));
  if(rows.length && /^op/i.test((rows[0][0]||'').trim())){ rows = rows.slice(1); } // drop header row if present
  return rows.map(cols=>({
    op_no:(cols[0]||'').trim(),
    group_name:(cols[1]||'').trim(),
    description:(cols[2]||'').trim(),
    std_hours:parseFloat(cols[3])||0,
    std_manpower:parseInt(cols[4])||1,
    execution_mode:(cols[5]||'').trim()==='Parallel' ? 'Parallel' : 'Series'
  })).filter(r=>r.description);
}

  async function refreshOpCount(){

    if(!modelId) return;
    const { count } = await sb.from('model_operations').select('*', {count:'exact', head:true}).eq('model_id', modelId);
    const line = document.getElementById('opCountLine');
    if(!count || count===0){
      line.innerHTML = '⚠ This model has 0 operations saved yet — the operator\'s dropdown will be empty. Fill it in via Model Master first, or choose "Start Blank" and add operations after creating the job.';
      line.style.color = 'var(--red-600)';
    } else {
      line.textContent = count + ' operation(s) will be copied in.';
      line.style.color = 'var(--steel-600)';
    }
  }
  document.getElementById('f_model').onchange = refreshOpCount;

  let copyOps = true;
  document.getElementById('copyYesBtn').onclick = ()=>{ copyOps=true; document.getElementById('copyYesBtn').classList.add('on'); document.getElementById('copyNoBtn').classList.remove('on'); };
  document.getElementById('copyNoBtn').onclick = ()=>{ copyOps=false; document.getElementById('copyNoBtn').classList.add('on'); document.getElementById('copyYesBtn').classList.remove('on'); };
  document.getElementById('createBtn').onclick = (e)=> withLock(e.target, 'Creating…', async ()=>{
    const machine_no = document.getElementById('f_machine').value.trim().toUpperCase();
    const customer = document.getElementById('f_customer').value.trim();
    const model_id = document.getElementById('f_model').value;
    const start_date = document.getElementById('f_start').value || null;
    const planned_end_date = document.getElementById('f_end').value || null;
    const delivery_date = document.getElementById('f_delivery').value || null;
    const actual_start_date = document.getElementById('f_actualstart').value || null;

    const { data: existingActive } = await sb.from('jobs').select('id, customer, models(model_name)').eq('machine_no', machine_no).eq('status','Active');
    if(existingActive && existingActive.length>0){

      if(!confirm(`Machine ${machine_no} already has an active job (${ex.customer||'no customer'}, ${ex.models?.model_name||''}). Create another active job on the same machine number anyway?`)) return;

    if(copyOps){

      const rows = (modelOps||[]).map(o=>({ job_id: job.id, op_no:o.op_no, group_name:o.group_name, description:o.description, std_hours:o.std_hours, std_manpower:o.std_manpower, execution_mode:o.execution_mode||'Series', sequence:o.sequence }));
      if(rows.length){
        const { error: opErr } = await sb.from('job_operations').insert(rows);
        if(opErr) toast('Job created, but copying operations failed: '+opErr.message, true);
      }
    }
    toast('Job created — review its operations below, then head to Jobs / QR Labels to print.');
    openOpsEditor({
      title: 'Job Operations — ' + machine_no,
      loadFn: async ()=> (await sb.from('job_operations').select('*').eq('job_id', job.id).order('sequence')).data,
      saveFn: async (list)=>{
        await sb.from('job_operations').delete().eq('job_id', job.id);
        const rows = list.map((o,i)=>({ job_id:job.id, op_no:o.op_no, group_name:o.group_name, description:o.description, std_hours:o.std_hours, std_manpower:o.std_manpower, execution_mode:o.execution_mode||'Series', sequence:i }));
        if(rows.length) return sb.from('job_operations').insert(rows);
        return {error:null};
      },
      filenamePrefix: machine_no
    });
  });
}

      if(!data || data.length===0) return toast('Delete blocked — you may need to run migration_004_job_delete_policy.sql on your database', true);
      toast('Job deleted'); renderJobsQr(app);
    };
  });

  document.querySelectorAll('[data-editdetails]').forEach(b=>{
    b.onclick = ()=> openJobDetailsEditor(jobs.find(j=>j.id===b.dataset.editdetails), app);
  });

  document.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=> openOpsEditor({
      title: 'Job Operations — ' + b.dataset.machine,
      loadFn: async ()=> (await sb.from('job_operations').select('*').eq('job_id', b.dataset.edit).order('sequence')).data,
      saveFn: async (list)=>{
        await sb.from('job_operations').delete().eq('job_id', b.dataset.edit);
        const rows = list.map((o,i)=>({ job_id:b.dataset.edit, op_no:o.op_no, group_name:o.group_name, description:o.description, std_hours:o.std_hours, std_manpower:o.std_manpower, execution_mode:o.execution_mode||'Series', sequence:i }));
        if(rows.length) return sb.from('job_operations').insert(rows);
        return {error:null};
      },
      filenamePrefix: b.dataset.machine
    });
  });

  document.getElementById('checkList').innerHTML = activeJobs.map(j=>`
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;font-size:13px;color:var(--graphite-950);">
      <input type="checkbox" class="jobChk" value="${j.id}" style="width:auto;"> ${esc(j.machine_no)} — ${esc(j.customer||'')} — ${esc(j.models?.model_name||'')}
    </label>`).join('') || '<div class="empty">No active jobs to label.</div>';

  document.getElementById('selectAllChk').onchange = (e)=>{
    document.querySelectorAll('.jobChk').forEach(c=> c.checked = e.target.checked);
  };

  document.getElementById('buildBtn').onclick = ()=>{
    const chosen = [...document.querySelectorAll('.jobChk:checked')].map(c=>c.value);
    if(chosen.length===0) return toast('Select at least one job', true);
    let startPos = parseInt(document.getElementById('startPosInput').value) || 1;
    if(startPos < 1) startPos = 1;
    if(startPos > 24) startPos = 24;
    buildLabelSheet(chosen, activeJobs, startPos);
    document.getElementById('printProfiles').style.display='flex';
    document.getElementById('printProfiles').scrollIntoView({behavior:'smooth'});
  };
  document.getElementById('printMethodBtn').onclick = ()=> handlePrint('method');
  document.getElementById('printMfgBtn').onclick = ()=> handlePrint('mfg');
  // Remember the last print profile used on this device, so it doesn't need reselecting every session.
  const lastProfile = localStorage.getItem('jobcard_print_profile');
  if(lastProfile === 'mfg'){
    document.getElementById('printMfgBtn').classList.remove('ghost');
    document.getElementById('printMethodBtn').classList.add('ghost');
  }
}

// Two print profiles — only the top margin differs (10mm less for "mfg"), because
// different physical printer/browser combos shift where printing starts on the sheet.
function handlePrint(profile){
  const sheet = document.getElementById('sheet');
  if(!sheet){ toast('Build the label sheet first', true); return; }
  const topMargin = profile === 'mfg' ? '6.479mm' : '13.479mm';
  sheet.style.paddingTop = topMargin;
  localStorage.setItem('jobcard_print_profile', profile);
  const oldTitle = document.title;
  document.title = 'QR_Labels_' + new Date().toISOString().slice(0,10);
  window.print();
  setTimeout(()=>{ document.title = oldTitle; }, 600);
}

function buildLabelSheet(jobIds, activeJobs, startPos){
  const area = document.getElementById('printArea');
  area.style.display='block';
  area.innerHTML = `<div class="label-sheet" id="sheet"></div>`;
  const sheet = document.getElementById('sheet');
  const baseUrl = window.location.origin + window.location.pathname;
  // Leading blank cells so printing lands on an already-partly-used sheet at the right spot.
  const skip = Math.max(0, (startPos||1) - 1);
  for(let i=0;i<skip;i++){
    const blank = document.createElement('div');
    blank.className='label';
    blank.style.visibility='hidden';
    blank.style.border='none';
    sheet.appendChild(blank);
  }
  jobIds.forEach(id=>{
    const j = activeJobs.find(x=>x.id===id);
    if(!j) return;
    const url = baseUrl + '?job=' + j.qr_token;
    const cell = document.createElement('div');
    cell.className='label';
    const qrDiv = document.createElement('div'); qrDiv.className='qrbox';
    cell.appendChild(qrDiv);
    const info = document.createElement('div'); info.className='info';
    info.innerHTML = `<b>${esc(j.machine_no)}</b>${esc(j.customer||'')}<br>${esc(j.models?.model_name||'')}`;
    cell.appendChild(info);
    sheet.appendChild(cell);
    new QRCode(qrDiv, { text:url, width:82, height:82, colorDark:'#1a1e22', colorLight:'#ffffff' });
  });
}

/* ================= OPERATOR SCAN ================= */
async function renderScan(app, token){
  const { data: job } = await sb.from('jobs').select('*, models(model_name)').eq('qr_token', token).single();
  if(!job || job.status!=='Active'){
    app.innerHTML = `<div class="panel"><div class="empty">${job ? 'This job is completed. QR is no longer active — check with your supervisor.' : 'Invalid QR code.'}</div></div>`;

      <select id="s_op"><option value="">— Select —</option>
        ${sortedOps.map(o=>`<option value="${o.id}" ${suggestedOp && o.id===suggestedOp.id?'selected':''}>${o.is_completed?'✓ ':''}${esc(o.op_no)} — ${esc(o.description)}${o.execution_mode==='Parallel'?' [Parallel]':''} (${o.std_hours}h std)</option>`).join('')}
      </select>
      ${ops && ops.some(o=>o.is_completed) ? '<div class="stat-line">✓ = already logged as Completed at least once</div>' : ''}
      ${(!ops || ops.length===0) ? '<div class="stat-line" style="color:var(--red-600);">No operations are set up for this job yet — tell your supervisor before submitting.</div>' : ''}

      <label>Work Started?</label>
      <div class="toggle-pair">
        <button type="button" class="on" id="workYesBtn">Yes</button>
        <button type="button" id="workNoBtn">No — nothing done today</button>
      </div>

      <div class="row2">
        <div><label>Activity Date</label><input id="s_date" type="date" value="${today}"></div>
        <div></div>
      </div>
      <div class="row2" id="timeRow">
        <div><label>Start Time <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(defaults to shift start — edit if different)</span></label><input id="s_start" type="time" value="09:00"></div>
        <div><label>End Time <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(defaults to shift end — edit if different)</span></label><input id="s_end" type="time" value="17:30"></div>
      </div>
      <div class="stat-line" id="netHoursLine" style="margin-top:-6px;"></div>
      <div id="statusBlock">
        <label>Status</label>
        <div class="seg" id="statusSeg">
          <button type="button" class="on Completed" data-s="Completed"><span class="lamp green"></span>Completed</button>
          <button type="button" class="Partial" data-s="Partial"><span class="lamp amber"></span>Partial</button>
          <button type="button" class="Hold" data-s="Hold"><span class="lamp red"></span>Hold</button>
        </div>
      </div>
      <input type="hidden" id="s_status" value="Completed">
      <input type="hidden" id="s_workstarted" value="yes">

      <div id="delayFields" style="display:none;">
        <div class="toggle-pair" id="noWorkStatusToggle" style="display:none;margin-bottom:6px;">
          <button type="button" id="nwsNotStartedBtn">Not Yet Started</button>
          <button type="button" class="on" id="nwsHoldBtn">Hold</button>
        </div>
        <label id="issueLabel">Issue / Delay Reason</label>
        <textarea id="s_issue" placeholder="e.g. wheel head not received, partial material only…"></textarea>
        <div class="row2">
          <div><label id="delayHrsLabel">Delay Hours</label><input id="s_delayhrs" type="number" step="0.5" min="0" placeholder="e.g. 2"></div>
          <div><label id="respLabel">Responsibility</label>
            <select id="s_resp">
              <option value="">— Select —</option>
              ${(resp||[]).map(r=>`<option>${esc(r.name)}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <div id="extraOpsSection">
        <label>Other operators helping (optional)</label>
        <div id="extraOps"></div>
        <button class="btn ghost small" id="addExtraBtn" type="button">+ Add another operator</button>
      </div>

      <button class="btn amber" id="s_submit" style="width:100%;text-align:center;margin-top:22px;">Submit Entry</button>
    </div>
  `;

  let workStarted = 'yes'; // 'yes' | 'no'

  function updateFieldVisibility(){
    const status = document.getElementById('s_status').value;
    if(workStarted === 'no'){
      document.getElementById('timeRow').style.display = 'none';
      document.getElementById('netHoursLine').textContent = '';
      document.getElementById('statusBlock').style.display = 'none';
      document.getElementById('extraOpsSection').style.display = 'none';
      document.getElementById('delayFields').style.display = 'block';
      document.getElementById('noWorkStatusToggle').style.display = 'flex';
      if(status === 'Not Started'){
        document.getElementById('issueLabel').innerHTML = 'Reason <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(optional — why hasn\'t it started yet)</span>';
        document.getElementById('delayHrsLabel').innerHTML = 'Hours Lost <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(optional)</span>';
        document.getElementById('respLabel').innerHTML = 'Responsibility <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(optional)</span>';
      } else {
        document.getElementById('issueLabel').innerHTML = 'Issue / Delay Reason <span style="color:var(--red-600);text-transform:none;font-weight:400;">(required)</span>';
        document.getElementById('delayHrsLabel').innerHTML = 'Hours Lost <span style="color:var(--red-600);text-transform:none;font-weight:400;">(required)</span>';
        document.getElementById('respLabel').innerHTML = 'Responsibility <span style="color:var(--red-600);text-transform:none;font-weight:400;">(required)</span>';
      }
    } else {
      document.getElementById('timeRow').style.display = 'grid';
      document.getElementById('statusBlock').style.display = 'block';
      document.getElementById('extraOpsSection').style.display = 'block';
      document.getElementById('delayFields').style.display = 'block';
      document.getElementById('noWorkStatusToggle').style.display = 'none';
      if(status === 'Hold'){
        document.getElementById('issueLabel').innerHTML = 'Issue / Delay Reason <span style="color:var(--red-600);text-transform:none;font-weight:400;">(required)</span>';
        document.getElementById('delayHrsLabel').innerHTML = 'Delay Hours <span style="color:var(--red-600);text-transform:none;font-weight:400;">(required)</span>';
        document.getElementById('respLabel').innerHTML = 'Responsibility <span style="color:var(--red-600);text-transform:none;font-weight:400;">(required)</span>';
      } else {
        document.getElementById('issueLabel').innerHTML = 'Issue / Delay Reason <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(optional)</span>';
        document.getElementById('delayHrsLabel').innerHTML = 'Delay Hours <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(optional)</span>';
        document.getElementById('respLabel').innerHTML = 'Responsibility <span style="color:var(--steel-600);text-transform:none;font-weight:400;">(optional)</span>';
      }
    }
  }

  document.getElementById('workYesBtn').onclick = ()=>{
    workStarted='yes'; document.getElementById('s_workstarted').value='yes';
    document.getElementById('workYesBtn').classList.add('on'); document.getElementById('workNoBtn').classList.remove('on');
    document.getElementById('s_status').value = 'Completed';
    document.querySelectorAll('#statusSeg button').forEach(x=>x.classList.toggle('on', x.dataset.s==='Completed'));
    updateFieldVisibility();
    refreshNetHours();
  };
  document.getElementById('workNoBtn').onclick = ()=>{
    workStarted='no'; document.getElementById('s_workstarted').value='no';
    document.getElementById('workNoBtn').classList.add('on'); document.getElementById('workYesBtn').classList.remove('on');
    document.getElementById('s_status').value = 'Hold';
    document.getElementById('nwsHoldBtn').classList.add('on'); document.getElementById('nwsNotStartedBtn').classList.remove('on');
    updateFieldVisibility();
  };
  document.getElementById('nwsNotStartedBtn').onclick = ()=>{
    document.getElementById('s_status').value = 'Not Started';
    document.getElementById('nwsNotStartedBtn').classList.add('on'); document.getElementById('nwsHoldBtn').classList.remove('on');
    updateFieldVisibility();
  };
  document.getElementById('nwsHoldBtn').onclick = ()=>{
    document.getElementById('s_status').value = 'Hold';
    document.getElementById('nwsHoldBtn').classList.add('on'); document.getElementById('nwsNotStartedBtn').classList.remove('on');
    updateFieldVisibility();
  };
  document.querySelectorAll('#statusSeg button').forEach(b=>{
    b.onclick = ()=>{
      document.getElementById('s_status').value = b.dataset.s;
      document.querySelectorAll('#statusSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      updateFieldVisibility();
    };
  });
  updateFieldVisibility();

  function refreshNetHours(){
    const startEl = document.getElementById('s_start'), endEl = document.getElementById('s_end'), lineEl = document.getElementById('netHoursLine');
    if(!startEl || !endEl || !lineEl || workStarted==='no'){ if(lineEl) lineEl.textContent=''; return; }
    const net = toHours(startEl.value, endEl.value);
    lineEl.textContent = (startEl.value && endEl.value) ? `Net working time: ${net.toFixed(2)} h (fixed breaks deducted automatically)` : '';
  }
  document.getElementById('s_start').addEventListener('input', refreshNetHours);
  document.getElementById('s_end').addEventListener('input', refreshNetHours);
  refreshNetHours();

  document.getElementById('addExtraBtn').onclick = ()=>{
    const row = document.createElement('div');
    row.className='row2'; row.style.marginTop='6px';
    row.innerHTML = `<div><input placeholder="Operator name" class="extraName"></div><div><input placeholder="Hours" class="extraHours"></div>`;
    document.getElementById('extraOps').appendChild(row);
  };

  // Stage-skip guard: if the selected op has an earlier Series-mode op that isn't
  // marked complete yet, ask the operator whether they meant to log that one instead.
  const opSelect = document.getElementById('s_op');
  let lastConfirmedOpId = suggestedOp ? suggestedOp.id : '';
  opSelect.addEventListener('change', async ()=>{
    const selectedId = opSelect.value;
    if(!selectedId || selectedId === lastConfirmedOpId) return;
    const selectedOp = (ops||[]).find(o=>o.id===selectedId);
    if(!selectedOp) return;
    const earlierIncomplete = (ops||[])
      .filter(o=> o.sequence < selectedOp.sequence && o.execution_mode !== 'Parallel' && !o.is_completed)
      .sort((a,b)=> a.sequence - b.sequence)[0];
    if(!earlierIncomplete) { lastConfirmedOpId = selectedId; return; }
    const choice = await showChoiceModal({
      title: 'Previous stage not completed',
      body: `${earlierIncomplete.op_no} — ${earlierIncomplete.description} comes before ${selectedOp.op_no} — ${selectedOp.description} and isn't marked Completed yet. What would you like to do?`,
      choiceA: `Go back to ${earlierIncomplete.op_no} (previous log)`,
      choiceB: `Continue with ${selectedOp.op_no} anyway`
    });
    if(choice === 'a'){
      opSelect.value = earlierIncomplete.id;
      lastConfirmedOpId = earlierIncomplete.id;
    } else {
      lastConfirmedOpId = selectedId;
    }
  });
  document.getElementById('s_submit').onclick = (e)=> withLock(e.target, 'Submitting…', async ()=>{
    const name=document.getElementById('s_name').value.trim();
    const op_id=document.getElementById('s_op').value;
    const date=document.getElementById('s_date').value;
    const start=document.getElementById('s_start').value;
    const end=document.getElementById('s_end').value;
    const status=document.getElementById('s_status').value;
    const issue=document.getElementById('s_issue').value.trim();
    const delayHrs=document.getElementById('s_delayhrs').value;
    const resp=document.getElementById('s_resp').value;

    if(!name) { toast('Enter your name', true); return; }
    if(!op_id) { toast('Select an operation', true); return; }
    if(!date) { toast('Fill the activity date', true); return; }

    if(workStarted === 'no'){
      if(status === 'Hold'){
        if(!issue) { toast('Issue/Delay reason is required', true); return; }
        if(!delayHrs) { toast('Enter hours lost', true); return; }
        if(!resp) { toast('Select Responsibility', true); return; }
      }
    } else {
      if(!start||!end) { toast('Fill start and end time', true); return; }
      if(status==='Hold'){
        if(!issue) { toast('Issue/Delay reason is required for Hold', true); return; }
        if(!delayHrs) { toast('Enter delay hours for Hold', true); return; }
        if(!resp) { toast('Select Responsibility for Hold', true); return; }
      }
    }

    const entryId = crypto.randomUUID();
    const { error } = await sb.from('entries').insert({
      id: entryId, job_id: job.id, job_operation_id: op_id, primary_operator: name,
      activity_date: date, start_time: (workStarted==='no' ? null : start), end_time: (workStarted==='no' ? null : end),
      status, issue_reason: issue||null,
      delay_hours: delayHrs ? parseFloat(delayHrs) : null, responsibility: resp || null
    });
    if(error) { toast(error.message, true); return; }

    const extraRows = [...document.querySelectorAll('#extraOps .row2')].map(r=>({
      entry_id: entryId,
      operator_name: r.querySelector('.extraName').value.trim(),
      hours: parseFloat(r.querySelector('.extraHours').value)||0
    })).filter(r=>r.operator_name);
    if(extraRows.length) await sb.from('entry_operators').insert(extraRows);

    app.innerHTML = `<div class="panel"><div class="empty"><span class="lamp green" style="width:16px;height:16px;"></span><br><br>Entry submitted for <b>${esc(job.machine_no)}</b>.<br><br>
      <button class="btn amber" id="another">Log Another Entry</button></div></div>`;
    document.getElementById('another').onclick=()=>renderScan(app, token);
  });
}

    const { error } = await sb.from('entries').update({
      job_id, job_operation_id, primary_operator, activity_date, start_time, end_time, status, issue_reason, delay_hours, responsibility
    }).eq('id', entry.id);
    if(error) { toast(error.message, true); return; }
    toast('Entry updated');
    panel.style.display='none'; panel.innerHTML='';
    renderDashboard(app);
  });
  panel.scrollIntoView({behavior:'smooth'});
}

/* ================= BULK ADD (paste missed entries) ================= */
function parseBulkEntries(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(lines.length===0) return [];
  let rows = lines.map(l=>l.split('\t'));
  if(rows.length && /^machine/i.test((rows[0][0]||'').trim())) rows = rows.slice(1);
  return rows.map(cols=>({
    machine_no:(cols[0]||'').trim().toUpperCase(), op_no:(cols[1]||'').trim(), operator:(cols[2]||'').trim(),
    date:(cols[3]||'').trim(), start:(cols[4]||'').trim(), end:(cols[5]||'').trim(),
    status:(cols[6]||'').trim() || 'Completed', issue:(cols[7]||'').trim(), delayHrs:(cols[8]||'').trim(), resp:(cols[9]||'').trim()
  })).filter(r=>r.machine_no && r.operator && r.date);
}
async function bulkAddEntries(rows, resultsEl){
  const jobCache = {};
  const results = [];
  for(const r of rows){
    let job = jobCache[r.machine_no];
    if(job === undefined){
      const { data: jobsFound } = await sb.from('jobs').select('id').eq('machine_no', r.machine_no).order('created_at',{ascending:false}).limit(1);
      job = (jobsFound && jobsFound[0]) || null;
      jobCache[r.machine_no] = job;
    }
    if(!job){ results.push({...r, ok:false, reason:'Machine not found'}); continue; }
    const { data: opsFound } = await sb.from('job_operations').select('id').eq('job_id', job.id).eq('op_no', r.op_no).limit(1);
    const op = opsFound && opsFound[0];
    if(!op){ results.push({...r, ok:false, reason:'Operation "'+r.op_no+'" not found on that machine\'s job'}); continue; }
    if(!['Completed','Partial','Hold'].includes(r.status)){ results.push({...r, ok:false, reason:'Status must be Completed, Partial, or Hold'}); continue; }
    if((r.status==='Completed' || r.status==='Partial') && (!r.start || !r.end)){ results.push({...r, ok:false, reason:'Start and End time are required for Completed/Partial status'}); continue; }
    if(r.status==='Hold' && (!r.issue || !r.delayHrs || !r.resp)){ results.push({...r, ok:false, reason:'Hold requires issue, delay hours, responsibility'}); continue; }
    results.push({...r, ok:true, job_id:job.id, job_operation_id:op.id});
  }
  const validRows = results.filter(r=>r.ok).map(r=>({
    id: crypto.randomUUID(), job_id:r.job_id, job_operation_id:r.job_operation_id, primary_operator:r.operator,
    activity_date:r.date, start_time:r.start||null, end_time:r.end||null, status:r.status,
    issue_reason:r.issue||null, delay_hours:r.delayHrs?parseFloat(r.delayHrs):null, responsibility:r.resp||null
  }));
  if(validRows.length){
    const { error } = await sb.from('entries').insert(validRows);
    if(error){ resultsEl.innerHTML = `<div class="stat-line" style="color:var(--red-600);">Insert failed: ${esc(error.message)}</div>`; return false; }
  }
  const failedRows = results.filter(r=>!r.ok);
  resultsEl.innerHTML = `<div class="stat-line"><b>${validRows.length}</b> added successfully${failedRows.length? ', <b>'+failedRows.length+'</b> failed:':''}</div>` +
    (failedRows.length ? failedRows.map(r=>`<div style="color:var(--red-600);font-size:12px;padding:3px 0;">${esc(r.machine_no)} / Op ${esc(r.op_no)} (${esc(r.operator)}) — ${esc(r.reason)}</div>`).join('') : '');
  return validRows.length > 0;
}

/* ================= EFFICIENCY / CHART HELPERS ================= */
// Fixed daily breaks — used to compute NET working hours automatically from any start/end time.
const SHIFT_BREAKS = [
  ['09:00','09:15'], // tea break
  ['11:00','11:15'], // tea break
  ['13:00','13:30'], // lunch
  ['15:00','15:30'], // tea break
  ['17:15','17:30'], // closing / tea break
];
function timeToMins(t){
  const [h,m] = (t||'').split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
// Minutes of overlap between [aStart,aEnd) and [bStart,bEnd), all in same-day minute space.
function overlapMins(aStart,aEnd,bStart,bEnd){
  return Math.max(0, Math.min(aEnd,bEnd) - Math.max(aStart,bStart));
}
// Net working hours between a start/end clock time, automatically deducting any of the
// fixed breaks (9:00-9:15, 11:00-11:15, 1:00-1:30, 3:00-3:30, 5:15-5:30) that fall inside the span.
function toHours(start, end){
  const sm = timeToMins(start), em0 = timeToMins(end);
  if(sm===null || em0===null) return 0;
  let em = em0;
  if(em < sm) em += 24*60; // overnight shift
  let grossMins = em - sm;
  let breakMins = 0;
  SHIFT_BREAKS.forEach(([bs,be])=>{
    const bsM = timeToMins(bs), beM = timeToMins(be);
    breakMins += overlapMins(sm, em, bsM, beM);
    breakMins += overlapMins(sm, em, bsM+24*60, beM+24*60); // in case span crosses midnight into next day's breaks
  });
  return Math.max(0, (grossMins - breakMins) / 60);
}
/* ================= SCHEDULING ENGINE (Assembly Target Date / Est. Delivery Date) ================= */
// Working-day calculator: given a start date, a daily capacity (shifts/day × hours/shift),
// and a quantity of std hours still to complete, walks forward day by day — skipping Sundays —
// until cumulative capacity meets the required hours, and returns that calendar date.
function computeTargetDate(startDateStr, totalHours, shiftsPerDay, hoursPerShift){
  if(!startDateStr || !totalHours || totalHours<=0) return startDateStr || null;
  const dailyCapacity = Math.max(0.1, (parseFloat(shiftsPerDay)||1) * (parseFloat(hoursPerShift)||7.5));
  let cum = 0;
  let d = new Date(startDateStr + 'T00:00:00');
  let guard = 0;
  while(guard < 3650){
    if(d.getDay() !== 0){ // Sunday = day off
      cum += dailyCapacity;
      if(cum >= totalHours - 1e-9) return d.toISOString().slice(0,10);
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  return d.toISOString().slice(0,10);
}
function addDaysStr(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
// Green = on/before SO delivery date · Yellow = late but within a 3-day buffer · Red = beyond buffer
function deliveryRiskLevel(estDateStr, soDateStr, bufferDays){
  if(!estDateStr || !soDateStr) return null;
  bufferDays = bufferDays==null ? 3 : bufferDays;
  if(estDateStr <= soDateStr) return 'green';
  if(estDateStr <= addDaysStr(soDateStr, bufferDays)) return 'yellow';
  return 'red';
}

function applyDatePreset(preset, fromEl, toEl){
  const fmt = d => d.toISOString().slice(0,10);
  const today = new Date();
  if(preset==='today'){ fromEl.value = fmt(today); toEl.value = fmt(today); }
  else if(preset==='week'){
    const day = today.getDay();
    const monday = new Date(today); monday.setDate(today.getDate() - ((day+6)%7));
    fromEl.value = fmt(monday); toEl.value = fmt(today);
  } else if(preset==='month'){
    const first = new Date(today.getFullYear(), today.getMonth(), 1);
    fromEl.value = fmt(first); toEl.value = fmt(today);
  } else { fromEl.value=''; toEl.value=''; }
}
// Cumulative Std Hours method: a Completed operation earns its full Std Hours regardless of
// actual time taken; an operation not yet Completed earns exactly the actual hours
// logged against it so far (this running total is "Cumulative Std Hours").
// Efficiency % = Cumulative Std Hours ÷ Machine Hours × 100.
function computeEfficiency(filteredEntries, jobOpsAll, entryOpsByEntry, jobsById){
  const byJob = {};
  filteredEntries.forEach(e=>{ if(e.job_id) (byJob[e.job_id] = byJob[e.job_id] || []).push(e); });
  const rows = [];
  Object.keys(byJob).forEach(jobId=>{
    const jobEntries = byJob[jobId];
    const job = jobsById[jobId];
    if(!job) return;
    const jobOps = jobOpsAll.filter(o=>o.job_id===jobId);
    const stdHours = jobOps.reduce((s,o)=> s + (parseFloat(o.std_hours)||0), 0);
    const opActualMap = {};
    let actualHours = 0, actualLabourHours = 0;
    jobEntries.forEach(e=>{
      const dur = toHours(e.start_time, e.end_time);
      actualHours += dur;
      actualLabourHours += dur;
      if(e.job_operation_id) opActualMap[e.job_operation_id] = (opActualMap[e.job_operation_id]||0) + dur;
      (entryOpsByEntry[e.id]||[]).forEach(x=> actualLabourHours += parseFloat(x.hours)||0);
    });
    let earnedHours = 0;
    Object.keys(opActualMap).forEach(opId=>{
      const op = jobOps.find(o=>o.id===opId);
      if(op && op.is_completed) earnedHours += parseFloat(op.std_hours)||0;
      else earnedHours += opActualMap[opId];
    });
    const effPct = actualHours>0 ? (earnedHours/actualHours*100) : null;
    rows.push({ job_id:jobId, machine_no:job.machine_no, customer:job.customer, model_name:job.models?.model_name,
      stdHours, actualHours, actualLabourHours, earnedHours, effPct });
  });
  return rows.sort((a,b)=> (a.machine_no||'').localeCompare(b.machine_no||''));
}

  let lastFilteredEntries=[], lastEffRows=[];
